name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # actions/setup-node@v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release commit belongs to origin/main
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Release tag commit must belong to origin/main" >&2
            exit 1
          fi

      - name: Verify clean tagged release state
        run: npm run release:check

      - name: Verify version is not already published
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_versions="$(npm view "$package_name" versions --json --prefer-online --registry=https://registry.npmjs.org)"
          node - "$package_name" "$package_version" "$published_versions" <<'NODE'
          const assert = require('node:assert/strict');
          const [name, version, json] = process.argv.slice(2);
          const versions = JSON.parse(json);
          assert(Array.isArray(versions), 'npm versions must be an array');
          assert(!versions.includes(version), `${name}@${version} is already published`);
          NODE

      - name: Publish to npm
        run: npm publish --access public

      - name: Verify published gitHead and package contents
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          metadata="$RUNNER_TEMP/published-release.json"
          node scripts/verify-published.mjs metadata "$package_name" "$package_version" "$GITHUB_SHA" "$metadata"
          tarball_url="$(node -e 'console.log(require(process.argv[1]).dist.tarball)' "$metadata")"
          package_dir="$(mktemp -d)"
          tarball="$(npm pack "$tarball_url" --pack-destination "$package_dir" --silent --prefer-online --registry=https://registry.npmjs.org)"
          node scripts/verify-published.mjs archive "$metadata" "$package_dir/$tarball"
          tar -xzf "$package_dir/$tarball" -C "$package_dir"
          cmp dist/snapshot.json "$package_dir/package/dist/snapshot.json"
          node - "$package_dir/package/dist/build-info.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const publishedPath = process.argv[2];
          const local = JSON.parse(fs.readFileSync('dist/build-info.json', 'utf8'));
          const published = JSON.parse(fs.readFileSync(publishedPath, 'utf8'));

          // prepublishOnly rebuilds the package, so builtAt legitimately changes.
          delete local.builtAt;
          delete published.builtAt;
          assert.deepStrictEqual(published, local);
          NODE
          cmp operators/node/index.js "$package_dir/package/operators/node/index.js"
